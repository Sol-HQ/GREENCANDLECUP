services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8787:8787"
    env_file:
      - .env
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8787
      NEXT_PUBLIC_WS_URL: ws://localhost:8787/ws
    depends_on:
      - server
